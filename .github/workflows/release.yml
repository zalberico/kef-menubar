# Builds "KEF Menu Bar.app" and publishes it.
#
#   git tag v1.2.0 && git push origin v1.2.0   -> GitHub Release v1.2.0 with KEF-Menu-Bar-1.2.0.zip
#   Actions > Release > Run workflow           -> test build, downloadable from the run's artifacts
#   A pull request that changes this file or the build script also gets a test build.
#
# Signing: with the Developer ID secrets below the app is signed with Developer ID,
# notarized and stapled, so it opens with no warning. Without them it is ad-hoc signed
# and people have to allow it once in System Settings (see the README).
#
#   DEVELOPER_ID_P12           base64 of the "Developer ID Application" certificate + key (.p12)
#   DEVELOPER_ID_P12_PASSWORD  password of that .p12
#   NOTARY_KEY_P8              base64 of an App Store Connect API key (.p8)
#   NOTARY_KEY_ID              that key's ID
#   NOTARY_ISSUER_ID           the issuer ID shown on the App Store Connect keys page
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/build-app.sh

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
            label="$version"
          else
            version="0.0.0"
            label="dev-${GITHUB_SHA::7}"
          fi
          [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] || { echo "::error::Tag must look like v1.2.0, not $GITHUB_REF_NAME"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip=KEF-Menu-Bar-$label.zip" >> "$GITHUB_OUTPUT"
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Import Developer ID certificate
        if: env.DEVELOPER_ID_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          [[ -n "$identity" ]] || { echo "::error::No Developer ID Application identity in DEVELOPER_ID_P12"; exit 1; }
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          # Without a Developer ID, sign ad-hoc (the script's fallback when no identity is found).
          export CODESIGN_IDENTITY="${CODESIGN_IDENTITY:--}"
          scripts/build-app.sh

      - name: Notarize
        if: env.CODESIGN_IDENTITY != '' && env.NOTARY_KEY_P8 != ''
        run: |
          key="$RUNNER_TEMP/notary.p8"
          echo "$NOTARY_KEY_P8" | base64 --decode > "$key"
          ditto -c -k --keepParent "build/KEF Menu Bar.app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait --timeout 20m
          xcrun stapler staple "build/KEF Menu Bar.app"
          spctl --assess --type execute --verbose=2 "build/KEF Menu Bar.app"
          rm "$key"

      - name: Package
        run: |
          ditto -c -k --keepParent "build/KEF Menu Bar.app" "${{ steps.version.outputs.zip }}"
          codesign -dv "build/KEF Menu Bar.app" 2>&1 | grep -E "Authority|Signature|Identifier" || true
          shasum -a 256 "${{ steps.version.outputs.zip }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.zip }}
          path: ${{ steps.version.outputs.zip }}
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.version.outputs.zip }}
        run: |
          if [[ -n "${CODESIGN_IDENTITY:-}" && -n "$NOTARY_KEY_P8" ]]; then
            note="Signed with Developer ID and notarized by Apple: unzip, move **KEF Menu Bar** to Applications and open it."
          else
            note="This build is not notarized. After unzipping and moving **KEF Menu Bar** to Applications, open it once, then allow it in **System Settings › Privacy & Security › Open Anyway**. See the README for details."
          fi
          notes="$(printf '%s\n\nRequires macOS 14 Sonoma or later on Apple silicon.\n\n' "$note")"
          gh release create "$GITHUB_REF_NAME" "$ZIP" --title "KEF Menu Bar $GITHUB_REF_NAME" \
            --notes "$notes" --generate-notes --verify-tag
