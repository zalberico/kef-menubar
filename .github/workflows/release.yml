# Builds "Speakeasy.app", the Mac menu bar app's GitHub (Developer ID) build, and publishes it.
# (Up to 1.2.0 it was "KEF Menu Bar.app" in KEF-Menu-Bar-<version>.zip; the bundle ID, settings
# and update feed are unchanged, and Sparkle updates an installed copy in place, under its old
# name.) The Mac App Store build is separate: macOS/Speakeasy.xcodeproj, no Sparkle, built
# and uploaded from Xcode, not here.
#
#   git tag v1.3.0 && git push origin v1.3.0   -> GitHub Release v1.3.0 with Speakeasy-1.3.0.zip
#   Actions > Release > Run workflow           -> test build, downloadable from the run's artifacts
#   A pull request that changes the package, sources, tests, this file or the build script
#   also gets a test build (signed and notarized when the secrets are available; never published).
#
# Signing: with the Developer ID secrets below the app is signed with Developer ID,
# notarized and stapled, so it opens with no warning. Without them it is ad-hoc signed
# and people have to allow it once in System Settings (see the README).
#
#   DEVELOPER_ID_P12           base64 of the "Developer ID Application" certificate + key (.p12)
#   DEVELOPER_ID_P12_PASSWORD  password of that .p12
#   NOTARY_KEY_P8              base64 of an App Store Connect API key (.p8)
#   NOTARY_KEY_ID              that key's ID
#   NOTARY_ISSUER_ID           the issuer ID shown on the App Store Connect keys page
#
# Auto-updates: the app checks appcast.xml on the latest release (Sparkle). With this secret,
# a tag's release also gets an appcast.xml whose item is the zip, EdDSA-signed. In the
# repository SUFeedURL points at, a tag build fails without this secret or without Developer ID
# signing and notarization, since its release becomes the one installed copies check. Test
# builds, and releases in a fork, still build without any of these secrets.
#
#   SPARKLE_ED_PRIVATE_KEY     the Sparkle EdDSA private key (generate_keys -x), matching
#                              SUPublicEDKey in Resources/Info.plist
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/build-app.sh
      - scripts/make-appcast.sh
      - scripts/make-ios-icon.swift
      - Package.swift
      - Package.resolved
      - Resources/**
      - Sources/**
      - Tests/**

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      # The image's default Xcode is often not its newest. Build with the newest stable one.
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          xcode="$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|rc' | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
            label="$version"
          else
            version="0.0.0"
            label="dev-${GITHUB_SHA::7}"
          fi
          [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] || { echo "::error::Tag must look like v1.2.0, not $GITHUB_REF_NAME"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip=Speakeasy-$label.zip" >> "$GITHUB_OUTPUT"
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      # The Mac App Store build (macOS/Speakeasy.xcodeproj) compiles these sources with APPSTORE
      # set, and isn't built here. Compile its code paths too, so a change that breaks them
      # fails CI. Its own scratch path keeps this from rebuilding the main build's products.
      - name: Compile the App Store code paths
        run: swift build --product KEFMenuBar -Xswiftc -DAPPSTORE --scratch-path .build/appstore

      - name: Import Developer ID certificate
        if: env.DEVELOPER_ID_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          [[ -n "$identity" ]] || { echo "::error::No Developer ID Application identity in DEVELOPER_ID_P12"; exit 1; }
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          # Without a Developer ID, sign ad-hoc (the script's fallback when no identity is found).
          export CODESIGN_IDENTITY="${CODESIGN_IDENTITY:--}"
          scripts/build-app.sh

      - name: Notarize
        if: env.CODESIGN_IDENTITY != '' && env.NOTARY_KEY_P8 != ''
        run: |
          key="$RUNNER_TEMP/notary.p8"
          echo "$NOTARY_KEY_P8" | base64 --decode > "$key"
          ditto -c -k --keepParent build/Speakeasy.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait --timeout 20m
          xcrun stapler staple build/Speakeasy.app
          spctl --assess --type execute --verbose=2 build/Speakeasy.app
          rm "$key"

      - name: Package
        run: |
          ditto -c -k --keepParent build/Speakeasy.app "${{ steps.version.outputs.zip }}"
          codesign -dv build/Speakeasy.app 2>&1 | grep -E "Authority|Signature|Identifier" || true
          shasum -a 256 "${{ steps.version.outputs.zip }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.zip }}
          path: ${{ steps.version.outputs.zip }}
          if-no-files-found: error

      # Signs the zip that was just packaged, so this runs for test builds too (as a check);
      # only a tag's appcast is published. A tag release becomes "latest", which is where
      # installed copies look for appcast.xml (SUFeedURL). So a tag in the repository that
      # feed points at fails here rather than publish a release with no appcast (every
      # installed copy's check would fail) or one that offers an ad-hoc, un-notarized build
      # as an update to Developer ID copies (Sparkle would install it). A fork's releases
      # aren't anyone's feed, so they still publish without an appcast.
      - name: Appcast
        id: appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          ZIP: ${{ steps.version.outputs.zip }}
        run: |
          feed="$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' Resources/Info.plist)"
          if [[ "$GITHUB_REF_TYPE" == tag && "$feed" == "https://github.com/$GITHUB_REPOSITORY/releases/"* ]]; then
            if [[ -z "${CODESIGN_IDENTITY:-}" || -z "$NOTARY_KEY_P8" ]]; then
              echo "::error::Installed copies update from this repository's latest release, and this build isn't signed with Developer ID and notarized. Set the Developer ID and notary secrets."
              exit 1
            fi
            if [[ -z "$SPARKLE_ED_PRIVATE_KEY" ]]; then
              echo "::error::Installed copies update from this repository's latest release, and without the SPARKLE_ED_PRIVATE_KEY secret it would have no appcast.xml."
              exit 1
            fi
          fi
          if [[ -z "$SPARKLE_ED_PRIVATE_KEY" ]]; then
            echo "::notice::No SPARKLE_ED_PRIVATE_KEY secret, so no appcast.xml: installed copies won't be offered this build."
            exit 0
          fi
          repo="https://github.com/$GITHUB_REPOSITORY"
          scripts/make-appcast.sh "$ZIP" "$repo/releases/download/$GITHUB_REF_NAME/$ZIP" \
            "$repo/releases/tag/$GITHUB_REF_NAME" appcast.xml
          cat appcast.xml
          echo "file=appcast.xml" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.version.outputs.zip }}
          APPCAST: ${{ steps.appcast.outputs.file }}
        run: |
          if [[ -n "${CODESIGN_IDENTITY:-}" && -n "$NOTARY_KEY_P8" ]]; then
            note="Signed with Developer ID and notarized by Apple: unzip, move **Speakeasy** to Applications and open it. Installed copies of KEF Menu Bar update themselves to it (keeping their name in Finder)."
          else
            note="This build is not notarized. After unzipping and moving **Speakeasy** to Applications, open it once, then allow it in **System Settings › Privacy & Security › Open Anyway**. See the README for details."
          fi
          notes="$(printf '%s\n\nRequires macOS 14 Sonoma or later on Apple silicon.\n\n' "$note")"
          # gh uploads the assets to a draft and publishes it after, so the release only
          # becomes "latest" (where installed copies look for appcast.xml) with both in place.
          gh release create "$GITHUB_REF_NAME" "$ZIP" ${APPCAST:+"$APPCAST"} \
            --title "Speakeasy for Mac $GITHUB_REF_NAME" --notes "$notes" --generate-notes --verify-tag
